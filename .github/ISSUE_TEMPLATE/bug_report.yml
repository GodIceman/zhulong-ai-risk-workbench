name: Bug report
description: Report a reproducible product or engineering defect
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach private media, model weights, credentials, or personal data. Use a synthetic minimal example.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Static Pages demo
        - Frontend
        - Unified API
        - Image or text service
        - Video service
        - Setup or documentation
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Privacy-safe reproduction
      description: Include commands, synthetic input characteristics, and the smallest reproduction you can share.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      placeholder: main / v1.0.0 / commit SHA
  - type: textarea
    id: checks
    attributes:
      label: Verification already performed
      description: Tests, browsers, operating systems, or model-runtime checks you tried.
